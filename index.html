<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baja Griffon — IFF Campos Centro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #fff; }
    button { outline: none; }
    input, textarea, select { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="nav.jsx"></script>
  <script type="text/babel" src="home.jsx"></script>
  <script type="text/babel" src="historia.jsx"></script>
  <script type="text/babel" src="processo.jsx"></script>
  <script type="text/babel" src="noticias.jsx"></script>
  <script type="text/babel" src="patrocinadores.jsx"></script>
  <script type="text/babel" src="membros.jsx"></script>
  <script type="text/babel" src="contato.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const [page, setPage] = React.useState('home');

      React.useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, [page]);

      const renderPage = () => {
        switch (page) {
          case 'home':           return <HomePage setPage={setPage} />;
          case 'historia':       return <HistoriaPage />;
          case 'processo':       return <ProcessoPage />;
          case 'noticias':       return <NoticiasPage />;
          case 'patrocinadores': return <PatrocinadoresPage />;
          case 'membros':        return <MembrosPage />;
          case 'contato':        return <ContatoPage />;
          default:               return <HomePage setPage={setPage} />;
        }
      };

      return (
        <>
          <NavBar currentPage={page} setPage={setPage} />
          {renderPage()}
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
